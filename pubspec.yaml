name: fluttery_mate
description: "A modern Flutter application for browsing 42 student profiles"
publish_to: 'none'

# In Android, build-name is used as versionName while build-number is used as versionCode.
version: 1.1.0+2

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # UI (Material now ships as a package, separate from the Flutter SDK)
  material_ui: ^1.10.0
  cached_network_image: ^4.0.6
  flutter_svg: ^2.3.2
  shimmer: ^4.0.0

  # Networking & storage
  http: ^1.6.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0

  # State management
  provider: ^6.1.5+1

  # Date formatting
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

# App icon configuration (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 24
  # Adaptive icon (Android 8+) and themed / monochrome icon (Android 13+)
  adaptive_icon_background: "#009AA2"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/images/app_icon_monochrome.png"
  # The foreground art is already scaled into the 66dp safe zone, so no extra inset.
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_24pt-Regular.ttf
        - asset: assets/fonts/Inter_24pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_24pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_24pt-Bold.ttf
          weight: 700
